[project]
name = "vendorflow-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi", "uvicorn", "pydantic>=2,<3", "pydantic-settings",
  "sqlalchemy>=2,<3", "alembic", "langgraph>=1,<2", "langgraph-checkpoint-sqlite",
  "openai", "httpx", "structlog",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "pytest-socket", "respx", "hypothesis"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "--disable-socket"
testpaths = ["tests"]
pythonpath = ["."]
